name: Build and Test Multi OS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
    - name: Download Acceptance tests
      run: python .github/workflows/download_acceptance_roms.py
    - name: Build
      run: cargo build --verbose
    - name: Run unit-tests
      run: cargo test --verbose

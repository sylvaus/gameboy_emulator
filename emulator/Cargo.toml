[package]
name = "emulator"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33.3"
log = { version = "0.4.20", features = ["std"] }
macros = { path = "../macros" }
sdl2 = { version = "0.38.0", optional = true }
env_logger = "0.11.6"
rfd = "0.16.0"
spin_sleep = "1.2.0"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.143"

[features]
sdl2-ui = ["sdl2"]
